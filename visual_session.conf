# ~/.config/kitty/visual_session.conf
# Sesion puramente decorativa: paneles con efectos visuales, sin comandos de trabajo real.

# ---------------------------------------------------------------------------
# Pestaña 1: "Matrix" — lluvia de caracteres estilo Matrix + reloj grande
# ---------------------------------------------------------------------------
new_tab Matrix
layout splits

launch --location=vsplit --title "Lluvia" bash -c 'echo -e "\e[32m"; while :; do for i in $(seq 1 20); do echo $LINES $COLUMNS $((RANDOM % COLUMNS)) $((RANDOM % LINES)); done | awk "{ printf \"\\033[%s;%sH\\033[2;32m%s\", \$4, \$3, substr(\"01アイウエオカキクケコ!@#\$%^&*()\", (int(rand()*30))+1, 1) }"; sleep 0.05; done'

launch --location=hsplit --title "Reloj" bash -c 'while :; do clear; echo; echo; for l in $(date "+%H:%M:%S" | fold -w1); do echo -n " $l"; done; echo; echo; echo "   $(date "+%A %d de %B, %Y")" | tr "[:lower:]" "[:upper:]"; sleep 1; done'

# ---------------------------------------------------------------------------
# Pestaña 2: "Colores" — arcoíris en movimiento + logo de Kitty
# ---------------------------------------------------------------------------
new_tab Colores
layout splits

launch --location=vsplit --title "Arcoiris" bash -c 'while :; do for c in 196 202 208 214 220 226 190 154 118 82 46 47 48 49 50 51 45 39 33 27 21 57 93 129 165 201; do printf "\e[38;5;%sm████████████████████████████████████████\e[0m\n" "$c"; done; sleep 0.08; clear; done'

launch --location=hsplit --title "Logo" bash -c 'while :; do clear; kitten icat --align=center ~/.local/kitty.app/lib/kitty/logo/kitty-128.png 2>/dev/null || echo "🐱 KITTY TERMINAL"; sleep 5; done'
