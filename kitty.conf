## ~/.config/kitty/kitty.conf
## Configuración avanzada de Kitty — cursor trail, tema Catppuccin, tab bar con reloj/nombre

# ---------------------------------------------------------------------------
# CURSOR
# ---------------------------------------------------------------------------
cursor_shape                   beam
cursor_beam_thickness          1.8
cursor_blink_interval          -1
cursor_stop_blinking_after     15.0

# --- Cursor trail (el "rastro" al mover el cursor) ---
cursor_trail                   3
cursor_trail_decay             0.1 0.4
cursor_trail_start_threshold   2

# ---------------------------------------------------------------------------
# FUENTE
# ---------------------------------------------------------------------------
font_family      family="JetBrainsMono Nerd Font" style=Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never
font_features    none
adjust_line_height  100%
adjust_column_width 100%

# ---------------------------------------------------------------------------
# APARIENCIA / TRANSPARENCIA
# ---------------------------------------------------------------------------
background_opacity   0.75
background_blur      24
dynamic_background_opacity yes
window_padding_width  10
hide_window_decorations no
confirm_os_window_close 0

# ---------------------------------------------------------------------------
# PESTAÑAS (TAB BAR) — reloj, fecha y nombre personalizados vía tab_bar.py
# ---------------------------------------------------------------------------
tab_bar_edge                bottom
tab_bar_style                custom
tab_bar_min_tabs             1
tab_title_template            "{index}: {title}"
active_tab_font_style        bold-italic
inactive_tab_font_style      normal

# ---------------------------------------------------------------------------
# DISTRIBUCIÓN DE VENTANAS (LAYOUTS)
# ---------------------------------------------------------------------------
enabled_layouts   splits,stack,tall,fat,grid
window_resize_step_cells  2
window_resize_step_lines  2
window_border_width       1.0
active_border_color       #89b4fa
inactive_border_color     #45475a
window_margin_width       4

# ---------------------------------------------------------------------------
# SCROLLBACK / RENDIMIENTO
# ---------------------------------------------------------------------------
scrollback_lines          10000
scrollback_pager_history_size 512
repaint_delay              8
input_delay                2
sync_to_monitor            yes

# ---------------------------------------------------------------------------
# INTEGRACIÓN CON LA SHELL / CONTROL REMOTO
# ---------------------------------------------------------------------------
shell_integration     enabled
allow_remote_control   yes
listen_on              unix:/tmp/kitty
update_check_interval  0

# ---------------------------------------------------------------------------
# TEMA DE COLORES (Catppuccin Mocha)
# ---------------------------------------------------------------------------
foreground              #cdd6f4
background              #000000
selection_foreground    #1e1e2e
selection_background    #f5e0dc

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# ---------------------------------------------------------------------------
# ATAJOS DE TECLADO PERSONALIZADOS
# ---------------------------------------------------------------------------
map ctrl+shift+enter    new_window
map ctrl+shift+t        new_tab
map ctrl+shift+w        close_window
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+f        show_scrollback
map ctrl+shift+g        toggle_layout stack
map ctrl+shift+u        kitten unicode_input
map ctrl+shift+e        kitten hints
map f11                 toggle_fullscreen

# --- Alternar opacidad del fondo ---
map ctrl+shift+o remote_control set-background-opacity --all --toggle 0.88
map f9            remote_control set-background-opacity --all --toggle 1

# ---------------------------------------------------------------------------
# VARIOS
# ---------------------------------------------------------------------------
enable_audio_bell        no
visual_bell_duration     0.1
remember_window_size     yes
initial_window_width     900
initial_window_height    600
close_on_child_death     no
macos_option_as_alt      no
custom_shaders cursor-trail-lightning


